services:
  - type: web
    name: jansuno-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:all
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
